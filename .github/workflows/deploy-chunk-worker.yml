name: Deploy Lambda Workers

on:
  push:
    branches: [main]
    paths:
      - "lambdas/worker/document-chunk-worker/**"
      - "lambdas/worker/ci-worker/**"
      - "lambdas/worker/search-worker/**"
      - "lambdas/orchestrator/search-orchestrator/**"
      - "lambdas/ner/**"
      - "lambdas/normalize/**"
      - "lambdas/embedding/**"
      - "lambdas/ontology/**"
      - "lambdas/index/**"
      - "shared/**"
      - "tools/deploy_document_chunk_worker.sh"
      - "tools/deploy_ci_worker.sh"
      - "tools/deploy_search_worker.sh"
      - "tools/deploy_search_orchestrator.sh"
      - ".github/workflows/deploy-chunk-worker.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which lambda to deploy"
        required: false
        default: all
        type: choice
        options:
          - all
          - document-chunk-worker
          - ci-worker
          - search-worker
          - search-orchestrator
      deployment:
        description: "Deployment environment"
        required: false
        default: dev
        type: choice
        options:
          - dev
          - qa
          - cqa
          - prod

jobs:
  config:
    name: Resolve deployment config (${{ github.event.inputs.deployment || 'dev' }})
    runs-on: ubuntu-latest
    outputs:
      deployment:              ${{ steps.set.outputs.deployment }}
      aws_region:               ${{ steps.set.outputs.aws_region }}
      callback_url:             ${{ steps.set.outputs.callback_url }}
      role_arn:                 ${{ steps.set.outputs.role_arn }}
      opensearch_endpoint:      ${{ steps.set.outputs.opensearch_endpoint }}
      open_search_region:       ${{ steps.set.outputs.open_search_region }}
      secrets_manager_region:   ${{ steps.set.outputs.secrets_manager_region }}
      semantic_objects_index:   ${{ steps.set.outputs.semantic_objects_index }}
      document_worker_regions:  ${{ steps.set.outputs.document_worker_regions }}
      search_results_debug_bucket: ${{ steps.set.outputs.search_results_debug_bucket }}
      verifier_model:           ${{ steps.set.outputs.verifier_model }}
      results_debug_prefix:     ${{ steps.set.outputs.results_debug_prefix }}
      verify_max_out_tokens:    ${{ steps.set.outputs.verify_max_out_tokens }}
      verify_tokens_per_cand:   ${{ steps.set.outputs.verify_tokens_per_cand }}
    steps:
      - name: Set config for deployment
        id: set
        run: |
          DEPLOYMENT="${{ github.event.inputs.deployment || 'dev' }}"
          RESULTS_DEBUG_PREFIX="rls-ci-retrieval-search-results/debug"
          VERIFY_MAX_OUT_TOKENS="64000"
          VERIFY_TOKENS_PER_CAND="8000"

          case "$DEPLOYMENT" in
            dev)
              AWS_REGION="eu-west-1"
              CALLBACK_URL="https://api.app-dev.rlsciences.com"
              ROLE_ARN="arn:aws:iam::064051750322:role/rls-document-extraction-lambda-execution-role"
              OPENSEARCH_ENDPOINT="search-rls-dev-rhitzxwnctmuyq2l4kny5kwelu.eu-west-1.es.amazonaws.com"
              OPEN_SEARCH_REGION="eu-west-1"
              SECRETS_MANAGER_REGION="eu-west-1"
              SEMANTIC_OBJECTS_INDEX="semantic-objects-v3"
              DOCUMENT_WORKER_REGIONS='["eu-west-1","us-east-1","us-west-2","eu-central-1","ap-south-1"]'
              SEARCH_RESULTS_DEBUG_BUCKET="rls-file-bucket-eu"
              VERIFIER_MODEL="eu.anthropic.claude-haiku-4-5-20251001-v1:0"
              ;;
            qa)
              AWS_REGION="us-east-1"
              CALLBACK_URL="https://api.app-qa.rlsciences.com"
              ROLE_ARN="arn:aws:iam::166795844383:role/rls-document-extraction-lambda-execution-role"
              OPENSEARCH_ENDPOINT="search-rls-qa-u7jwn3q2hr3hxp7y2ydab34tfq.us-east-1.es.amazonaws.com"
              OPEN_SEARCH_REGION="us-east-1"
              SECRETS_MANAGER_REGION="us-east-1"
              SEMANTIC_OBJECTS_INDEX="semantic-objects-v3"
              DOCUMENT_WORKER_REGIONS='["us-east-1","us-west-2","us-east-2","eu-central-1","ap-south-1"]'
              SEARCH_RESULTS_DEBUG_BUCKET="rls-file-bucket-qa"
              VERIFIER_MODEL="us.anthropic.claude-haiku-4-5-20251001-v1:0"
              ;;
            cqa)
              AWS_REGION="eu-west-1"
              CALLBACK_URL="https://api.app-cqa.rlsciences.com"
              ROLE_ARN="arn:aws:iam::166795844383:role/rls-document-extraction-lambda-execution-role"
              OPENSEARCH_ENDPOINT="search-rls-cqa-7sgyfh75bof4w5raojeqrtpwue.eu-west-1.es.amazonaws.com"
              OPEN_SEARCH_REGION="eu-west-1"
              SECRETS_MANAGER_REGION="eu-west-1"
              SEMANTIC_OBJECTS_INDEX="semantic-objects-v3"
              DOCUMENT_WORKER_REGIONS='["eu-west-1"]'
              SEARCH_RESULTS_DEBUG_BUCKET="rls-file-bucket-cqa"
              VERIFIER_MODEL="eu.anthropic.claude-haiku-4-5-20251001-v1:0"
              ;;
            prod)
              AWS_REGION="eu-west-1"
              CALLBACK_URL="https://api.app.rlsciences.com"
              ROLE_ARN="arn:aws:iam::027698832617:role/rls-document-extraction-lambda-execution-role"
              OPENSEARCH_ENDPOINT="search-rls-prod-uswe3hhrfhtfq7feh3wnowy7tq.eu-west-1.es.amazonaws.com"
              OPEN_SEARCH_REGION="eu-west-1"
              SECRETS_MANAGER_REGION="eu-west-1"
              SEMANTIC_OBJECTS_INDEX="semantic-objects-v3"
              DOCUMENT_WORKER_REGIONS='["eu-west-1","us-east-1","us-west-2","eu-central-1","ap-south-1"]'
              SEARCH_RESULTS_DEBUG_BUCKET="rls-file-bucket-internal"
              VERIFIER_MODEL="eu.anthropic.claude-haiku-4-5-20251001-v1:0"
              ;;
            *)
              echo "Unknown deployment: $DEPLOYMENT" >&2
              exit 1
              ;;
          esac

          {
            echo "deployment=$DEPLOYMENT"
            echo "aws_region=$AWS_REGION"
            echo "callback_url=$CALLBACK_URL"
            echo "role_arn=$ROLE_ARN"
            echo "opensearch_endpoint=$OPENSEARCH_ENDPOINT"
            echo "open_search_region=$OPEN_SEARCH_REGION"
            echo "secrets_manager_region=$SECRETS_MANAGER_REGION"
            echo "semantic_objects_index=$SEMANTIC_OBJECTS_INDEX"
            echo "document_worker_regions=$DOCUMENT_WORKER_REGIONS"
            echo "search_results_debug_bucket=$SEARCH_RESULTS_DEBUG_BUCKET"
            echo "verifier_model=$VERIFIER_MODEL"
            echo "results_debug_prefix=$RESULTS_DEBUG_PREFIX"
            echo "verify_max_out_tokens=$VERIFY_MAX_OUT_TOKENS"
            echo "verify_tokens_per_cand=$VERIFY_TOKENS_PER_CAND"
          } >> "$GITHUB_OUTPUT"

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      document_chunk_worker: ${{ steps.filter.outputs.document_chunk_worker }}
      ci_worker:            ${{ steps.filter.outputs.ci_worker }}
      search_worker:        ${{ steps.filter.outputs.search_worker }}
      search_orchestrator:  ${{ steps.filter.outputs.search_orchestrator }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            document_chunk_worker:
              - 'lambdas/worker/document-chunk-worker/**'
              - 'lambdas/ner/**'
              - 'lambdas/normalize/**'
              - 'lambdas/embedding/**'
              - 'lambdas/embedding_cohere/**'
              - 'lambdas/ontology/**'
              - 'lambdas/index/**'
              - 'shared/**'
              - '.github/workflows/deploy-chunk-worker.yml'
            ci_worker:
              - 'lambdas/worker/ci-worker/**'
              - 'lambdas/ner/**'
              - 'lambdas/normalize/**'
              - 'lambdas/embedding/**'
              - 'lambdas/ontology/**'
              - 'lambdas/index/**'
              - 'shared/**'
              - '.github/workflows/deploy-chunk-worker.yml'
            search_worker:
              - 'lambdas/worker/search-worker/**'
              - 'lambdas/search/evidence_classification/**'
              - 'shared/**'
              - '.github/workflows/deploy-chunk-worker.yml'
            search_orchestrator:
              - 'lambdas/orchestrator/search-orchestrator/**'
              - 'shared/**'
              - '.github/workflows/deploy-chunk-worker.yml'

  # ── document-chunk-worker ────────────────────────────────────────────────────────
  deploy-document-chunk-worker:
    name: Deploy document-chunk-worker to ${{ matrix.region }}
    needs: [config, changes]
    if: |
      (github.event_name == 'push' && needs.changes.outputs.document_chunk_worker == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'document-chunk-worker'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        region: ${{ fromJSON(needs.config.outputs.document_worker_regions) }}
      max-parallel: 2

    env:
      FUNCTION_NAME:          rls-ci-retrieval-document-chunk-worker
      ECR_REPO:               rls-ci-retrieval-document-chunk-worker
      AWS_REGION:             ${{ matrix.region }}
      CALLBACK_URL:           ${{ needs.config.outputs.callback_url }}
      OPENSEARCH_ENDPOINT:    ${{ needs.config.outputs.opensearch_endpoint }}
      OPEN_SEARCH_REGION:     ${{ needs.config.outputs.open_search_region }}
      SECRETS_MANAGER_REGION: ${{ needs.config.outputs.secrets_manager_region }}
      SEMANTIC_OBJECTS_INDEX: ${{ needs.config.outputs.semantic_objects_index }}

    steps:
      - uses: actions/checkout@v4
      - name: Check secret visibility
        run: |
          if [ -n "$TOKEN" ]; then echo "AWS_SESSION_TOKEN: SET (len=${#TOKEN})"; else echo "AWS_SESSION_TOKEN: NOT SET / EMPTY"; fi
          if [ -n "$AKID" ]; then echo "AWS_ACCESS_KEY_ID: SET (len=${#AKID})"; else echo "AWS_ACCESS_KEY_ID: NOT SET / EMPTY"; fi
        env:
          TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AKID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ matrix.region }}
      - name: Debug AWS identity
        run: aws sts get-caller-identity
      - uses: docker/setup-buildx-action@v3
      - name: Deploy
        env:
          ROLE_ARN: ${{ needs.config.outputs.role_arn }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x tools/deploy_document_chunk_worker.sh
          tools/deploy_document_chunk_worker.sh

  # ── ci-worker ─────────────────────────────────────────────────────────────────
  deploy-ci-worker:
    name: Deploy ci-worker (rls-ci-retrieval-ci-worker)
    needs: [config, changes]
    if: |
      (github.event_name == 'push' && needs.changes.outputs.ci_worker == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'ci-worker'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FUNCTION_NAME:          rls-ci-retrieval-ci-worker
      ECR_REPO:               rls-ci-retrieval-ci-worker
      AWS_REGION:             ${{ needs.config.outputs.aws_region }}
      CALLBACK_URL:           ${{ needs.config.outputs.callback_url }}
      OPENSEARCH_ENDPOINT:    ${{ needs.config.outputs.opensearch_endpoint }}
      OPEN_SEARCH_REGION:     ${{ needs.config.outputs.open_search_region }}
      SECRETS_MANAGER_REGION: ${{ needs.config.outputs.secrets_manager_region }}
      SEMANTIC_OBJECTS_INDEX: ${{ needs.config.outputs.semantic_objects_index }}

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Debug AWS identity
        run: aws sts get-caller-identity
      - uses: docker/setup-buildx-action@v3
      - name: Deploy
        env:
          ROLE_ARN: ${{ needs.config.outputs.role_arn }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x tools/deploy_ci_worker.sh
          tools/deploy_ci_worker.sh

  # ── search-worker ─────────────────────────────────────────────────────────────────
  deploy-search-worker:
    name: Deploy search-worker (rls-ci-retrieval-search-worker)
    needs: [config, changes]
    if: |
      (github.event_name == 'push' && needs.changes.outputs.search_worker == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'search-worker'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FUNCTION_NAME:          rls-ci-retrieval-search-worker
      ECR_REPO:               rls-ci-retrieval-search-worker
      AWS_REGION:             ${{ needs.config.outputs.aws_region }}
      CALLBACK_URL:           ${{ needs.config.outputs.callback_url }}
      OPENSEARCH_ENDPOINT:    ${{ needs.config.outputs.opensearch_endpoint }}
      OPEN_SEARCH_REGION:     ${{ needs.config.outputs.open_search_region }}
      SECRETS_MANAGER_REGION: ${{ needs.config.outputs.secrets_manager_region }}
      SEMANTIC_OBJECTS_INDEX: ${{ needs.config.outputs.semantic_objects_index }}
      SEARCH_RESULTS_DEBUG_BUCKET: ${{ needs.config.outputs.search_results_debug_bucket }}
      VERIFIER_MODEL:         ${{ needs.config.outputs.verifier_model }}
      RESULTS_DEBUG_PREFIX:   ${{ needs.config.outputs.results_debug_prefix }}
      VERIFY_MAX_OUT_TOKENS:  ${{ needs.config.outputs.verify_max_out_tokens }}
      VERIFY_TOKENS_PER_CAND: ${{ needs.config.outputs.verify_tokens_per_cand }}

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Debug AWS identity
        run: aws sts get-caller-identity
      - uses: docker/setup-buildx-action@v3
      - name: Deploy
        env:
          ROLE_ARN: ${{ needs.config.outputs.role_arn }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x tools/deploy_search_worker.sh
          tools/deploy_search_worker.sh

  # ── search-orchestrator ────────────────────────────────────────────────────────────
  deploy-search-orchestrator:
    name: Deploy search-orchestrator (rls-ci-retrieval-search-orchestrator)
    needs: [config, changes]
    if: |
      (github.event_name == 'push' && needs.changes.outputs.search_orchestrator == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'search-orchestrator'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FUNCTION_NAME:          rls-ci-retrieval-search-orchestrator
      ECR_REPO:               rls-ci-retrieval-search-orchestrator
      AWS_REGION:             ${{ needs.config.outputs.aws_region }}
      CALLBACK_URL:           ${{ needs.config.outputs.callback_url }}
      OPENSEARCH_ENDPOINT:    ${{ needs.config.outputs.opensearch_endpoint }}
      OPEN_SEARCH_REGION:     ${{ needs.config.outputs.open_search_region }}
      SECRETS_MANAGER_REGION: ${{ needs.config.outputs.secrets_manager_region }}
      SEMANTIC_OBJECTS_INDEX: ${{ needs.config.outputs.semantic_objects_index }}
      SEARCH_RESULTS_DEBUG_BUCKET: ${{ needs.config.outputs.search_results_debug_bucket }}
      VERIFIER_MODEL:         ${{ needs.config.outputs.verifier_model }}
      RESULTS_DEBUG_PREFIX:   ${{ needs.config.outputs.results_debug_prefix }}

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Debug AWS identity
        run: aws sts get-caller-identity
      - uses: docker/setup-buildx-action@v3
      - name: Deploy
        env:
          ROLE_ARN: ${{ needs.config.outputs.role_arn }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x tools/deploy_search_orchestrator.sh
          tools/deploy_search_orchestrator.sh
